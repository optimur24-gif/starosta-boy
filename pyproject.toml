[project]
name = "bgmu-schedule-bot"
version = "0.1.0"
description = "Telegram bot for live BGMU schedules without schedule storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[socks]>=0.28,<0.29",
    "python-telegram-bot[job-queue]>=22,<23",
    "aiogram>=3.26,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
