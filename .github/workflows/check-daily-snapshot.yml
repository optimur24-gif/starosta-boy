name: Diagnose daily snapshot (no bots)
on:
  push:
    branches: [codex/admin-broadcasts]
    paths: [.github/workflows/check-daily-snapshot.yml, tools/check_daily_snapshot.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bgmu-daily-diagnostic
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ""
      RESTRICTED_BOT_TOKEN: ""
      BGMU_PROXY_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - name: Check representative groups, teachers and rooms, atomic database and backup
        run: uv run --locked python -m tools.check_daily_snapshot
      - name: Publish diagnostic counts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f verification/daily-diagnostic.json ]; then exit 0; fi
          git add verification/daily-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: record daily snapshot diagnostic'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
