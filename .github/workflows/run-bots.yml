name: Run bots and check schedules

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько минут держать ботов включёнными (5–120)'
        required: true
        default: '15'

permissions:
  contents: read

# Never poll the same Telegram identities from two workflow runs concurrently.
concurrency:
  group: bgmu-telegram-bots
  cancel-in-progress: true

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      BGMU_DATA_DIR: .data
      DATA_DIR: .data/restricted
      ADMIN_USERNAME: Timur0_15
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      RESTRICTED_BOT_TOKEN: ${{ secrets.RESTRICTED_BOT_TOKEN }}
      BGMU_PROXY_URL: ${{ secrets.BGMU_PROXY_URL }}
      RUN_MINUTES: ${{ inputs.minutes || '120' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run all tests without real tokens
        env:
          TELEGRAM_BOT_TOKEN: ''
          RESTRICTED_BOT_TOKEN: ''
          BGMU_PROXY_URL: ''
        run: uv run --locked python -m pytest -q
      - name: Diagnose secret bindings without revealing values
        run: |
          uv run --locked python - <<'PYCODE'
          import os
          for name in ('TELEGRAM_BOT_TOKEN', 'RESTRICTED_BOT_TOKEN'):
              value = os.environ.get(name, '').strip()
              print('::notice::' + name + ': ' + ('present' if value else 'MISSING'), flush=True)
          restricted = os.environ.get('RESTRICTED_BOT_TOKEN', '').strip()
          if restricted:
              print('::notice::Management bot identity: ' + ('correct' if restricted.split(':', 1)[0] == '8591550954' else 'WRONG TOKEN'), flush=True)
          PYCODE
      - name: Fetch configured group schedules
        continue-on-error: true
        run: |
          mkdir -p .runtime
          uv run --locked python -m bgmu_bot.check_source --live --report .runtime/website.json
      - name: Verify live snapshot and backups
        continue-on-error: true
        run: uv run --locked python -m tools.check_daily_snapshot
      - name: Download ALL group schedules and verify offline use
        run: uv run --locked python -m tools.fetch_schedule
      - name: Validate bot credentials and local configuration
        run: |
          uv run --locked python - <<'PY'
          import os
          from restricted_bot.policy import EXPECTED_BOT_ID
          def fail(message):
              print('::error::' + message, flush=True)
              raise SystemExit(1)
          for name in ('TELEGRAM_BOT_TOKEN', 'RESTRICTED_BOT_TOKEN'):
              token = os.environ.get(name, '').strip()
              if not token:
                  fail(f'Add {name} in repository Settings → Secrets and variables → Actions → Repository secrets.')
          public = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          restricted = os.environ['RESTRICTED_BOT_TOKEN'].strip()
          if public == restricted:
              fail('Two distinct bot tokens are required.')
          if restricted.split(':', 1)[0] != str(EXPECTED_BOT_ID):
              fail('RESTRICTED_BOT_TOKEN must be the SECOND supplied token (bot ID 8591550954).')
          duration = os.environ['RUN_MINUTES']
          if not duration.isdigit() or not 5 <= int(duration) <= 120:
              fail('Duration must be between 5 and 120 minutes.')
          print('Token bindings and configured management bot ID are valid; token values are hidden.')
          PY
          uv run --locked python -m restricted_bot --check
      - name: Run both bots (live console)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime
          echo "Starting both bots for ${RUN_MINUTES} minutes. Stop this run with Cancel workflow."
          set +e
          timeout --signal=INT --kill-after=30s "${RUN_MINUTES}m" ./run.sh 2>&1 | tee .runtime/bots.log
          bot_status=${PIPESTATUS[0]}
          set -e
          if [ "$bot_status" -eq 124 ]; then
            echo 'The configured trial period ended; both bots were stopped.'
            exit 0
          fi
          exit "$bot_status"
      - name: Save diagnostic reports and console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            .runtime/full-schedule.json
            .data/schedule.sqlite3
            .data/backups/schedule.sqlite3
            .runtime/website.json
            .runtime/bots.log
            verification/daily-diagnostic.json
